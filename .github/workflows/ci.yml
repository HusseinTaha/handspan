name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Runners ship an adb of their own but never a phone. Without this the live tests would
  # start a real adb daemon on the runner to prove nothing. See AdbTestEnvironment.
  ANDROIDEXPLORER_NO_DEVICE_TESTS: 1

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  cross-compile:
    name: Cross-compile ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, osx-x64, osx-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Catches a Windows-only API leaking into shared code. A real macOS run needs a Mac,
      # but this catches the common mistake, and it proves all four shipping targets build.
      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/AndroidExplorer.App/AndroidExplorer.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=none
          --output artifacts/${{ matrix.rid }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AndroidExplorer-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          retention-days: 7
